name: Portfolio QA
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  portfolio-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run qa:unit

  hero-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/qa-hero-geometry.mjs

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run db:generate
      - run: npx next typegen
      - run: npm run type-check
  compile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder?sslmode=require
      DIRECT_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder?sslmode=require
      AUTH_SECRET: ci-placeholder-only-not-a-production-secret
      NEXT_PUBLIC_SITE_URL: https://example.com
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run db:generate
      - run: npx next build --experimental-build-mode compile
